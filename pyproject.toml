[project]
name = "spacy-conll"
dynamic = ["version"]
description = "A custom pipeline component for spaCy that can convert any parsed Doc and its sentences into CoNLL-U format. Also provides a command line entry point."
authors = [
    {name = "Bram Vanroy", email = "bramvanroy@hotmail.com"},
]
maintainers = [
    {name = "Bram Vanroy", email = "bramvanroy@hotmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = [
    "conll",
    "conllu",
    "nlp",
    "parsing",
    "spacy",
    "spacy-extension",
    "spacy_stanza",
    "spacy_udpipe",
    "stanza",
    "tagging",
    "udpipe",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "spacy>=3.8,<4",
]

[project.optional-dependencies]
stanza = ["spacy-stanza>=1.0.4"]
udpipe = ["spacy-udpipe>=1.0.0"]
parsers = ["spacy-conll[stanza,udpipe]"]
pd = ["pandas"]
all = ["spacy-conll[parsers,pd]"]

[project.scripts]
parse-as-conll = "spacy_conll.cli.parse:main"

[project.entry-points.spacy_factories]
conll_formatter = "spacy_conll.formatter:create_conll_formatter"
disable_sbd = "spacy_conll.utils:create_spacy_disable_sentence_segmentation"

[project.urls]
Homepage = "https://github.com/BramVanroy/spacy_conll"
Documentation = "https://bramvanroy.github.io/spacy_conll"
Repository = "https://github.com/BramVanroy/spacy_conll"
Issues = "https://github.com/BramVanroy/spacy_conll/issues"
Changelog = "https://github.com/BramVanroy/spacy_conll/blob/main/HISTORY.md"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/spacy_conll"]

[dependency-groups]
docs = [
    "mike>=2.2,<3",
    "mkdocs-autorefs>=1.4.4,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=1.0.8,<2",
]
dev = [
    {include-group = "docs"},
    "en-core-web-sm",
    "pre-commit>=4.7,<5",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.1,<0.18",
    "spacy-conll[all]",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
strict = true
markers = [
    "stanza: needs spacy-stanza and downloads a stanza model",
    "udpipe: needs spacy-udpipe and downloads a udpipe model",
]

[tool.coverage.run]
source_pkgs = ["spacy_conll"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-native rules
    "D",   # pydocstyle
]
# E501: line length is handled by `ruff format`; long strings/URLs are fine.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["spacy_conll"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
