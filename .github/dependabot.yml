version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      # One group for all packages: every update touches uv.lock, so separate
      # PRs would conflict with each other after the first merge.
      uv:
        patterns: ["*"]
